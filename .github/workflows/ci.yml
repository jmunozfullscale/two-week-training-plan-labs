name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore api/EquipmentAllocations/EquipmentAllocations.slnx

      - name: Build Solution
        run: dotnet build api/EquipmentAllocations/EquipmentAllocations.slnx --no-restore --configuration Release

      - name: Run Tests with Code Coverage Gate
        run: dotnet test api/EquipmentAllocations/EquipmentAllocations.slnx --no-build --configuration Release --collect:"XPlat Code Coverage"
